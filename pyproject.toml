[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-post-design"
version = "0.1.0"
description = "Chiyi image generation and poster workflow for Hermes Agent"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "feariangod"}]
requires-python = ">=3.11,<3.14"
dependencies = [
    "requests>=2.31,<3",
    "Pillow>=10,<13",
]

[project.scripts]
hermes-post-design = "hermes_post_design.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
hermes_post_design = ["resources/**/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
