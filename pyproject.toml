[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-post-design"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "requests>=2.31,<3",
    "Pillow>=10,<13",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
