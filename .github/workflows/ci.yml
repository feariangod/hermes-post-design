name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q -o "addopts="

  poster-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/hermes_post_design/resources/skills/creative/poster-design/package-lock.json
      - run: npm ci --prefix src/hermes_post_design/resources/skills/creative/poster-design
      - run: npm test --prefix src/hermes_post_design/resources/skills/creative/poster-design

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install build
      - run: python -m build --wheel
      - name: Verify packaged Hermes resources
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          with ZipFile(wheel) as archive:
              names = archive.namelist()
          required = [
              "resources/plugins/image_gen/chiyi/provider.py",
              "resources/skills/media/chiyi-image-generation/SKILL.md",
              "resources/skills/creative/poster-design/SKILL.md",
          ]
          for suffix in required:
              assert any(name.endswith(suffix) for name in names), suffix
          PY
