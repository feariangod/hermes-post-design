name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q -o "addopts="

  poster-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/hermes_post_design/resources/skills/creative/poster-design/package-lock.json
      - run: npm ci --prefix src/hermes_post_design/resources/skills/creative/poster-design
      - run: npm test --prefix src/hermes_post_design/resources/skills/creative/poster-design
      - run: node --test tests/runtime/*.test.mjs

  installer-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [agents, codex, claude, hermes]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[test]"
      - name: Isolated ${{ matrix.target }} installer smoke test
        run: python tests/installer_smoke.py --target "${{ matrix.target }}"

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/hermes_post_design/resources/skills/creative/poster-design/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[test]" build
      - run: npm ci --prefix src/hermes_post_design/resources/skills/creative/poster-design
      - name: Compare clean and polluted wheels
        run: python -m pytest tests/test_package_contents.py -q -o "addopts="
      - run: python -m build --wheel
      - name: Verify Git-tracked Skill inventory and forbidden wheel entries
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          from zipfile import ZipFile

          from tests.skill_inventory import assert_file_hash_parity, git_tracked_file_hashes

          wheel = next(Path("dist").glob("*.whl"))
          with ZipFile(wheel) as archive:
              names = archive.namelist()
              skill_prefix = "hermes_post_design/resources/skills/creative/poster-design/"
              wheel_skill_hashes = {
                  name.removeprefix(skill_prefix): hashlib.sha256(archive.read(name)).hexdigest()
                  for name in names
                  if name.startswith(skill_prefix) and not name.endswith("/")
              }
          canonical = Path("src/hermes_post_design/resources/skills/creative/poster-design")
          tracked_hashes = git_tracked_file_hashes(Path.cwd(), canonical)
          assert_file_hash_parity(tracked_hashes, wheel_skill_hashes, "wheel Skill")
          required = [
              "resources/plugins/image_gen/chiyi/provider.py",
              "resources/skills/media/chiyi-image-generation/SKILL.md",
              "resources/skills/creative/poster-design/SKILL.md",
          ]
          for suffix in required:
              assert any(name.endswith(suffix) for name in names), suffix
          forbidden_parts = {
              "node_modules", "__pycache__", ".pytest_cache", "coverage", "artifacts", "cache", "sessions",
          }
          forbidden_names = {
              "auth.json", "config.yaml", "qa-report.json", "render-result.json", "visual-review.json",
          }
          for name in names:
              parts = Path(name).parts
              assert not set(parts) & forbidden_parts, name
              assert not name.lower().endswith((".png", ".pdf", ".log")), name
              if "resources" in parts:
                  relative_parts = parts[parts.index("resources") + 1:]
                  assert not any(part.endswith((".dist-info", ".egg-info")) for part in relative_parts), name
                  assert Path(name).name.lower() not in forbidden_names, name
                  assert not name.lower().endswith((".db", ".sqlite", ".sqlite3")), name
          PY
